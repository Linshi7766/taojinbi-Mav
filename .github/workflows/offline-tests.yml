name: offline tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 公开 Beta 的离线回归：只运行不连接设备、不下载 OCR 模型、不执行真实任务的
# 单元测试。生产模块把 uiautomator2 / easyocr 放在函数内惰性导入，因此测试
# 在纯标准库环境下即可运行（见设计 9.2）。

jobs:
  offline-tests:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # 私有专属测试模块（test_taojinbi_task_ui 等）顶层 import lxml；
        # opencv-python（headless 无 GUI，CI 友好）；ddddocr 是某个 legacy
        # 测试的 OCR 后备。PyTorch 需用专用 index 单独装，否则找不到
        # 通用包。
        run: |
          pip install lxml opencv-python-headless ddddocr
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile public sources
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            src/taojinbi_mav \
            scripts \
            tests

      - name: Run offline test suite
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          # 私有专属 legacy 测试需要 uiautomator2 / easyocr / torch 等重依赖
          # 才能跑通（公开仓库无这 3 个测试，所以公开 CI 一直能跑过）。CI
          # 统一排除：本地完整运行请 pip install uiautomator2 easyocr
          # torch --index-url https://download.pytorch.org/whl/cpu ddddocr。
          python -m unittest discover -s tests -t . -v \
            --ignore tests/test_taojinbi_task_ui.py \
            --ignore tests/test_utils_lazy_ocr.py \
            --ignore tests/test_utils_task_loop_integration.py

      - name: Fail if any device or model was touched
        shell: bash
        run: |
          set -euo pipefail
          if ls logs/*.jsonl >/dev/null 2>&1; then
            echo "offline tests must not create runtime logs" >&2
            exit 1
          fi
          echo "offline run clean: no runtime logs, no device or model access"
