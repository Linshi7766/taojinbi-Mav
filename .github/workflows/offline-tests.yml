name: offline tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 公开 Beta 的离线回归：只运行不连接设备、不下载 OCR 模型、不执行真实任务的
# 单元测试。生产模块把 uiautomator2 / easyocr 放在函数内惰性导入，因此测试
# 在纯标准库环境下即可运行（见设计 9.2）。

jobs:
  offline-tests:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile public sources
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            src/taojinbi_mav \
            scripts \
            tests

      - name: Run offline test suite
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          # 私有专属 legacy 测试（_*_legacy_*.py 或下划线开头的）需要
          # uiautomator2 / easyocr / torch 等重依赖；unittest discover 默认
          # pattern `test*.py` 不发现下划线开头文件，因此本地与 CI 都会自动
          # 跳过。完整运行请 pip install uiautomator2 easyocr torch ddddocr
          # 后 python -m unittest tests._test_legacy_xxx。
          python -m unittest discover -s tests -t . -v

      - name: Fail if any device or model was touched
        shell: bash
        run: |
          set -euo pipefail
          if ls logs/*.jsonl >/dev/null 2>&1; then
            echo "offline tests must not create runtime logs" >&2
            exit 1
          fi
          echo "offline run clean: no runtime logs, no device or model access"
