name: offline tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 公开 Beta 的离线回归：只运行不连接设备、不下载 OCR 模型、不执行真实任务的
# 单元测试。生产模块把 uiautomator2 / easyocr 放在函数内惰性导入，因此测试
# 在纯标准库环境下即可运行（见设计 9.2）。

jobs:
  offline-tests:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # 私有专属测试模块（test_taojinbi_task_ui 等）顶层 import lxml，
        # 传递依赖 opencv-python（headless 无 GUI，CI 友好）；ddddocr
        # 是某个 legacy 测试的 OCR 后备。
        run: pip install lxml opencv-python-headless ddddocr

      - name: Compile public sources
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            src/taojinbi_mav \
            scripts \
            tests

      - name: Run offline test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -t . -v

      - name: Fail if any device or model was touched
        shell: bash
        run: |
          set -euo pipefail
          if ls logs/*.jsonl >/dev/null 2>&1; then
            echo "offline tests must not create runtime logs" >&2
            exit 1
          fi
          echo "offline run clean: no runtime logs, no device or model access"
